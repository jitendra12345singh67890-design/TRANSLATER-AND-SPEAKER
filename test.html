<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>English to Hindi Translator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;

            background: #000000;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;

            margin: 0;
        }

        .box {
            background: rgb(244, 244, 244);

            width: 550px;
            max-width: 90%;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 0 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;

            color: #333;

            margin-bottom: 20px;
        }

        textarea {
            width: 100%;

            height: 160px;

            padding: 12px;

            font-size: 18px;

            border: 2px solid #ddd;

            border-radius: 8px;

            resize: none;

            outline: none;
        }

        textarea:focus {
            border-color: #4285f4;
        }

        button {
            width: 100%;

            padding: 13px;

            margin-top: 12px;

            font-size: 18px;

            color: rgb(158, 85, 85);

            border: none;

            border-radius: 8px;

            cursor: pointer;
        }

        .translate {
            background: #4285f4;
        }

        .translate:hover {
            background: #33d646;
        }

        .speak {
            background: #110c0c;
        }

        .speak:hover {
            background: #00ff44;
        }

        .stop {
            background: #ea4335;
        }

        .stop:hover {
            background: #0a4dc1;
        }

        .clear {
            background: #d40e0e7b;
        }

        .clear:hover {
            background: #000000;
        }

        .result-title {
            margin-top: 20px;

            font-size: 17px;

            font-weight: bold;

            color: #555;
        }

        #output {
            margin-top: 8px;

            padding: 15px;

            min-height: 90px;

            background: #f5f5f5;

            border-radius: 8px;

            font-size: 20px;

            line-height: 1.5;

            word-wrap: break-word;
        }

        #status {
            text-align: center;

            margin-top: 12px;

            color: #666;

            font-size: 14px;
        }

    </style>

</head>


<body>


    <div class="box">


        <h1>🌐 English → Hindi</h1>


        <!-- English Input -->

        <textarea
            id="englishText"
            placeholder="Enter English text here..."></textarea>


        <!-- Translate -->

        <button
            class="translate"
            onclick="translateText()">

            🌐 Translate to Hindi

        </button>


        <!-- Hindi Result -->

        <div class="result-title">
            Hindi Translation:
        </div>


        <div id="output">

            Hindi translation will appear here...

        </div>


        <!-- English Speaker -->

        <button
            class="speak"
            onclick="speakEnglish()">

            🔊 Speak English

        </button>


        <!-- Stop -->

        <button
            class="stop"
            onclick="stopVoice()">

            ⏹️ Stop Voice

        </button>


        <!-- Clear -->

        <button
            class="clear"
            onclick="clearAll()">

            🧹 Clear

        </button>


        <div id="status">

            Ready

        </div>


    </div>


    <script>


        // =========================================
        // ENGLISH → HINDI TRANSLATION
        // =========================================


        async function translateText() {


            const text =
                document.getElementById(
                    "englishText"
                ).value;


            const output =
                document.getElementById(
                    "output"
                );


            const status =
                document.getElementById(
                    "status"
                );


            // Empty text check

            if (text.trim() === "") {

                output.innerText =
                    "Please enter some English text.";

                return;
            }


            output.innerText =
                "Translating...";


            status.innerText =
                "Please wait...";


            try {


                // Google Translate request

                const url =
                    "https://translate.googleapis.com/translate_a/single" +

                    "?client=gtx" +

                    "&sl=en" +

                    "&tl=hi" +

                    "&dt=t" +

                    "&q=" +

                    encodeURIComponent(text);


                const response =
                    await fetch(url);


                if (!response.ok) {

                    throw new Error(
                        "Translation failed"
                    );

                }


                const data =
                    await response.json();


                let result = "";


                // Translation collect

                data[0].forEach(
                    item => {

                        if (item[0]) {

                            result += item[0];

                        }

                    }
                );


                // Hindi show

                output.innerText =
                    result;


                status.innerText =
                    "Translation complete ✅";


            }

            catch (error) {


                console.error(error);


                output.innerText =
                    "Translation failed.";

                status.innerText =
                    "Internet connection check karo.";

            }

        }



        // =========================================
        // ENGLISH TEXT SPEAKER
        // =========================================


        function speakEnglish() {


            const text =
                document.getElementById(
                    "englishText"
                ).value;


            const status =
                document.getElementById(
                    "status"
                );


            // Empty check

            if (text.trim() === "") {

                alert(
                    "Pehle English text likho."
                );

                return;
            }


            // Previous voice stop

            speechSynthesis.cancel();


            // Speech object

            const speech =
                new SpeechSynthesisUtterance(
                    text
                );


            // English voice

            speech.lang =
                "en-US";


            // Speed

            speech.rate =
                0.9;


            // Pitch

            speech.pitch =
                1;


            // Volume

            speech.volume =
                1;


            // Start

            speech.onstart =
                function () {

                    status.innerText =
                        "🔊 Speaking English...";

                };


            // Finished

            speech.onend =
                function () {

                    status.innerText =
                        "✅ Voice finished";

                };


            // Error

            speech.onerror =
                function (event) {

                    console.log(event);

                    status.innerText =
                        "❌ Voice error";

                };


            // Speak

            speechSynthesis.speak(
                speech
            );

        }



        // =========================================
        // STOP VOICE
        // =========================================


        function stopVoice() {


            speechSynthesis.cancel();


            document.getElementById(
                "status"
            ).innerText =
                "⏹️ Voice stopped";

        }



        // =========================================
        // CLEAR EVERYTHING
        // =========================================


        function clearAll() {


            speechSynthesis.cancel();


            document.getElementById(
                "englishText"
            ).value = "";


            document.getElementById(
                "output"
            ).innerText =
                "Hindi translation will appear here...";


            document.getElementById(
                "status"
            ).innerText =
                "Ready";

        }

    </script>


</body>

</html>
